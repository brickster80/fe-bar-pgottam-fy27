resources:
  pipelines:
    febar_e2e_pipeline:
      name: febar-e2e-access-movement
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      channel: CURRENT
      photon: true
      continuous: false
      root_path: ../src/pipeline
      libraries:
        - notebook:
            path: ../src/pipeline/notebooks/01_bronze_ingest.sql
        - notebook:
            path: ../src/pipeline/notebooks/02_silver_normalize.sql
        - notebook:
            path: ../src/pipeline/notebooks/03_silver_identity_correlation.sql
        - notebook:
            path: ../src/pipeline/notebooks/04_gold_detections.sql
